<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP: permite Google Fonts (style + font) y los recursos locales.
      connect-src solo permite 'self' para que las llamadas IPC funcionen.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src  'self' 'unsafe-eval';
        style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src    'self' data: https://fonts.gstatic.com;
        img-src     'self' data: blob: https:;
        connect-src 'self'
          https://world.openfoodfacts.org
          https://world.openbeautyfacts.org
          https://world.openproductsfacts.org
          https://api.upcitemdb.com
          https://www.ean-search.org;
      "
    />
    <!-- Fuentes cargadas aquí — NO en el CSS (evita bloqueos de CSP en dev) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>POS MiniMarket</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
